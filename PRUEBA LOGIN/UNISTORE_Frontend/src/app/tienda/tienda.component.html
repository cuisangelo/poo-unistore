<div class="flex flex-row space-x-4 pt-2 pb-2 bg-[#6a1b0f]">
  <div class="pl-5"><img src="favicon.ico"></div>
  <div class=" basis-1/8"><a href="#" class="rounded-full cursor-pointer tracking-wider" ><p class="text-center uppercase font-bold text-white">UNI Store</p></a></div>
  <div class=" basis-1/2 grow"><p class="text-center"></p></div>
  <div class=" basis-1/8"><a href="login" class="rounded-full cursor-pointer tracking-wider" ><p class="text-center uppercase font-bold text-white">Iniciar Sesion</p></a></div>
  <div class=" basis-1/8"><a href="tienda" class="rounded-full cursor-pointer tracking-wider" ><p class="text-center uppercase font-bold text-white">Inicio</p></a></div>
  <div class=" basis-1/8"><a href="tienda" class="rounded-full cursor-pointer tracking-wider" ><p class="text-center uppercase font-bold text-white">Tienda</p></a></div>
  <div class=" basis-1/8 pr-5"><a href="register" class="rounded-full cursor-pointer tracking-wider" ><p class="text-center uppercase font-bold text-white">Perfil</p></a></div>
</div>
  <div>
    <div class="border-2 bg-[url('assets/imagenes/asdf.jpg')] space-y-4">
      <div class="w-fit mx-auto border-2 bg-white">
        <div class="box-border border-3 items-center" ><p class="text-center uppercase font-bold">Categoria</p></div>
        <div class="  pt-3 grid grid-cols-4 gap-4  ">
          <article *ngFor="let item of lista, let indice=index">
            <div class=" box-border md:box-content border-2 rounded-lg min-h-sm curso static pt-1 pr-1 pb-1 pl-1">
            <img [src]="item.url_imagen" class="img-responsive rounded-lg pb-2 h-200 margen">
              <div>
                <div class="text-center"><a class="text-md font-semibold ">{{item.nombre}}</a></div>
                <div><a class="text-xs">{{item.descripcion}}</a></div>
              </div>
              <div class="grid grid-cols-2 gap-1">
                <div class="text-center line-through font-semibold">{{item.precio_oferta}}</div>
                <div class="text-center ">{{item.precio_unitario}}</div>
              </div>
              <div class="grid grid-cols-2 gap-1">
                <div ><a class="btn" ><p class="text-center">Carrito</p></a></div>
                <div ><a class="btn" ><p class="text-center" [routerLink]="['/detalle/',indice]">Detalle</p></a></div>
              </div>
            <div class="content-center text-center bg-[#fe0000] rounded absolute top-1 left-1 flex"><span class="text-white text-xs font-bold">OFERTA</span></div>
            </div>
          </article>
        </div>
      </div>
    </div>
  </div>
