<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mi cuenta</title>
    <style>
        .body{
            background: linear-gradient(to right, lightblue, darkblue);
        }
        .container{
            background: #444;
            width: 550px;
            height: auto;
            margin: 0 auto;
            position: relative;
            margin-top: 3%;
            box-shadow: 10px 5px 30px;
            rgba(119,119,119,.5)
        }
        .barraIzq{
            float: left;
            top: -5%;
            left: 5%;
            position: absolute;
            width: 15%;
            height: 110%;
            background: darkred;
            box-shadow: 3px 3px 10px;
            rgba(119,119,119,.5);
            border: .1em solid#ffffff;
        }
        .bloqueDer{
            width: 60%;
            margin-left: 27%;
        }
        .input{
            width: 100%;
            padding: 7px;
            margin: 6px 0;
            border: none;
            border-bottom: 3px solid darkred;
            background: transparent;
            color: white;
        }
        .input:focus{
            background: #333;
            outline: none;
            border-bottom: 3px solid darkred;
        }
        .btn{
            text-transform: uppercase;
            font-size: 15px;
            border: 0;
            color: white;
            background: darkred;
            padding: 7px 15px;
            box-shadow: 0px 2px 4px 0px;
            rgba(0,0,0,.2);
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body class="body">
<div class="container">
    <div class="barraIzq">

    </div>
    <div class="bloqueDer">
        <div class="profile tabShow">
            <h1>Mi Cuenta</h1>
            <h2>Id</h2>
            <input type="number" class="input" value="5">
            <h2>Nombre</h2>
            <input type="text" class="input"  value="Juan">
            <h2>Apellido</h2>
            <input type="text" class="input"  value="Gomez">
            <h2>Direccion</h2>
            <input type="text" class="input" value="San Isidro">
            <h2>Telefono</h2>
            <input type="number" class="input"  value="950736444">
            <h2>Correo</h2>
            <input type="email" class="input"  value="juangomez@gmail.com">
            <h2>Contraseña</h2>
            <input type="password" class="input"  value="hola123"><br>
            <button class="btn">Actualizar</button>
        </div>
    </div>
</div>
</body>
</html>
