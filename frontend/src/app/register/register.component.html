<header class="bg-guinda text-white">
  <nav class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
    <a routerLink="/tienda" class="flex items-center gap-2">
      <img src="assets/imagenes/icono.ico" class="h-8 w-8 rounded" alt="UNI Store">
      <span class="font-bold tracking-wide uppercase">UNI Store</span>
    </a>
    <div class="flex-1"></div>
    <a routerLink="/tienda" class="text-sm font-semibold uppercase hover:text-accent">Inicio</a>
    <a routerLink="/tienda" class="text-sm font-semibold uppercase hover:text-accent">Tienda</a>
    <a routerLink="/register" class="text-sm font-semibold uppercase hover:text-accent">Perfil</a>
  </nav>
</header>

<main class="min-h-[70vh] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Regístrate</h1>

    <div *ngIf="errorStatus" class="bg-red-50 text-red-700 text-sm rounded-lg p-3 mb-4">
      <p>{{errorMsg}}</p>
    </div>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="registerByEmail(registerForm.value)"
      class="space-y-4"
    >
      <div>
        <label for="nombres" class="block text-sm font-semibold text-gray-700 mb-1">Nombres</label>
        <input
          type="text"
          id="nombres"
          formControlName="nombres"
          placeholder="Escriba su nombre"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-guinda/50 focus:border-guinda"
        />
      </div>
      <div>
        <label for="apellidos" class="block text-sm font-semibold text-gray-700 mb-1">Apellidos</label>
        <input
          type="text"
          id="apellidos"
          formControlName="apellidos"
          placeholder="Escriba su apellido"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-guinda/50 focus:border-guinda"
        />
      </div>
      <div>
        <label for="correo" class="block text-sm font-semibold text-gray-700 mb-1">Correo</label>
        <input
          type="email"
          id="correo"
          formControlName="correo"
          placeholder="Escriba su correo"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-guinda/50 focus:border-guinda"
        />
      </div>
      <div>
        <label for="contrasena" class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
        <input
          type="password"
          id="contrasena"
          formControlName="contrasena"
          placeholder="Escriba su contraseña"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-guinda/50 focus:border-guinda"
        />
      </div>
      <div>
        <label for="direccion" class="block text-sm font-semibold text-gray-700 mb-1">Dirección</label>
        <input
          type="text"
          id="direccion"
          formControlName="direccion"
          placeholder="Escriba su dirección"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-guinda/50 focus:border-guinda"
        />
      </div>
      <div>
        <label for="telefono" class="block text-sm font-semibold text-gray-700 mb-1">Teléfono</label>
        <input
          type="text"
          id="telefono"
          formControlName="telefono"
          placeholder="Escriba su teléfono"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-guinda/50 focus:border-guinda"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-guinda hover:bg-guinda-dark text-white font-semibold rounded-lg px-4 py-2.5"
      >
        Regístrate
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      ¿Ya estás registrado?
      <a routerLink="/login" class="text-guinda font-semibold hover:underline">Inicia sesión</a>
    </p>
  </div>
</main>
