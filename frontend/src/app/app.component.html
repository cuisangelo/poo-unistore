<div
  *ngIf="demo && bannerOpen"
  class="demo-banner sticky top-0 z-40 flex h-10 items-center justify-center border-b border-white/10 bg-zinc-950 px-12 text-center text-[13px] font-medium text-zinc-300"
>
  <div class="demo-banner-flow absolute inset-0" aria-hidden="true"></div>
  <div class="relative flex items-center gap-2.5">
    <span class="demo-dot" aria-hidden="true"></span>
    <span>
      <span class="font-semibold text-zinc-100">Entorno de demostración</span>
      · datos simulados, solo de referencia. Los cambios no se guardan.
    </span>
  </div>
  <button
    type="button"
    aria-label="Cerrar aviso"
    (click)="dismissBanner()"
    class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-zinc-500 hover:text-white"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </svg>
  </button>
</div>
<router-outlet></router-outlet>
