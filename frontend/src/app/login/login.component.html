<header class="bg-guinda text-white">
  <nav class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
    <a routerLink="/tienda" class="flex items-center gap-2">
      <img src="assets/imagenes/icono.ico" class="h-8 w-8 rounded" alt="UNI Store">
      <span class="font-bold tracking-wide uppercase">UNI Store</span>
    </a>
    <div class="flex-1"></div>
    <a routerLink="/tienda" class="text-sm font-semibold uppercase hover:text-accent">Inicio</a>
    <a routerLink="/tienda" class="text-sm font-semibold uppercase hover:text-accent">Tienda</a>
    <a routerLink="/register" class="text-sm font-semibold uppercase hover:text-accent">Perfil</a>
  </nav>
</header>

<main class="min-h-[70vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow p-8 text-center">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Iniciar sesión</h1>
    <p class="text-sm text-gray-600 mb-6">
      Esta demo no requiere iniciar sesión. El registro y el acceso se
      gestionan desde la página de registro.
    </p>
    <a
      routerLink="/register"
      class="block w-full bg-guinda hover:bg-guinda-dark text-white font-semibold rounded-lg px-4 py-2.5 mb-4"
      >Ir al registro</a
    >
    <a routerLink="/tienda" class="text-guinda font-semibold hover:underline"
      >Ir a la tienda</a
    >
  </div>
</main>
