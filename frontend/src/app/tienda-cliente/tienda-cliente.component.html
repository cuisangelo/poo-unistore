<header class="bg-guinda text-white">
  <nav class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
    <a routerLink="/tienda" class="flex items-center gap-2">
      <img src="assets/imagenes/icono.ico" class="h-8 w-8 rounded" alt="UNI Store">
      <span class="font-bold tracking-wide uppercase">UNI Store</span>
    </a>
    <div class="flex-1"></div>
    <a routerLink="/tienda" class="text-sm font-semibold uppercase hover:text-accent">Inicio</a>
    <a routerLink="/tienda" class="text-sm font-semibold uppercase hover:text-accent">Tienda</a>
    <a routerLink="/register" class="text-sm font-semibold uppercase hover:text-accent">Perfil</a>
    <a routerLink="/carrito" class="relative text-sm font-semibold uppercase hover:text-accent">
      Carrito
      <span
        *ngIf="cart.count > 0"
        class="absolute -top-2 -right-4 bg-accent text-white text-xs font-bold rounded-full px-1.5"
        >{{ cart.count }}</span
      >
    </a>
  </nav>
</header>

<main class="max-w-7xl mx-auto px-4 py-8">
  <img
    src="assets/imagenes/slider1.jpg"
    class="w-full h-56 object-cover rounded-xl mb-8"
    alt="UNI Store"
  >

  <h1 class="text-2xl font-bold text-gray-900 uppercase tracking-wide mb-6">
    Tienda
  </h1>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <article
      *ngFor="let item of lista, let indice=index"
      class="bg-white rounded-xl shadow-sm hover:shadow-lg transition overflow-hidden flex flex-col relative"
    >
      <img [src]="item.url_imagen" class="w-full aspect-[3/2] object-cover" [alt]="item.nombre">
      <span
        *ngIf="item.precio_oferta < item.precio_unitario"
        class="absolute top-2 left-2 bg-guinda text-white text-xs font-bold px-2 py-0.5 rounded-full"
        >OFERTA</span
      >
      <div class="p-4 flex-1">
        <p class="font-semibold text-gray-900">{{item.nombre}}</p>
        <p class="text-sm text-gray-500 line-clamp-2">{{item.descripcion}}</p>
        <div class="mt-2 flex items-baseline gap-2">
          <span class="text-lg font-bold text-guinda">s/ {{item.precio_oferta}}</span>
          <span class="line-through text-sm text-gray-400">s/ {{item.precio_unitario}}</span>
        </div>
      </div>
      <div class="p-4 pt-0 flex gap-2">
        <button
          (click)="cart.add(item)"
          class="bg-guinda hover:bg-guinda-dark text-white text-sm font-semibold rounded-lg px-3 py-2 flex-1"
        >
          Agregar
        </button>
        <a
          [routerLink]="['/detalle/',indice]"
          class="border border-guinda text-guinda hover:bg-guinda hover:text-white text-sm font-semibold rounded-lg px-3 py-2 flex-1 text-center"
          >Detalle</a
        >
      </div>
    </article>
  </div>
</main>
