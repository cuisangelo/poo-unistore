<header class="bg-guinda text-white">
  <nav class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
    <a routerLink="/tienda" class="flex items-center gap-2">
      <img src="assets/imagenes/icono.ico" class="h-8 w-8 rounded" alt="UNI Store">
      <span class="font-bold tracking-wide uppercase">UNI Store</span>
    </a>
    <div class="flex-1 text-center">
      <span class="text-sm font-semibold uppercase"
        >BIENVENIDO, {{ cliente?.nombres || '' | uppercase }}</span
      >
    </div>
    <a routerLink="/tienda" class="text-sm font-semibold uppercase hover:text-accent">Inicio</a>
    <a routerLink="/tienda" class="text-sm font-semibold uppercase hover:text-accent">Tienda</a>
    <a routerLink="/carrito" class="text-sm font-semibold uppercase hover:text-accent">Carrito</a>
    <a routerLink="/register" class="text-sm font-semibold uppercase hover:text-accent">Perfil</a>
  </nav>
</header>

<main class="max-w-3xl mx-auto px-4 py-8">
  <div class="bg-white rounded-xl shadow-sm p-8 grid sm:grid-cols-[auto,1fr] gap-8">
    <img
      src="assets/imagenes/uni.jpg"
      class="rounded-xl h-40 w-40 object-cover"
      alt="Foto de perfil"
    >
    <div class="space-y-4">
      <div>
        <p class="uppercase text-xs text-gray-500">Nombres</p>
        <p class="font-medium text-gray-900">{{ cliente?.nombres }}</p>
      </div>
      <div>
        <p class="uppercase text-xs text-gray-500">Apellidos</p>
        <p class="font-medium text-gray-900">{{ cliente?.apellidos }}</p>
      </div>
      <div>
        <p class="uppercase text-xs text-gray-500">Dirección</p>
        <p class="font-medium text-gray-900">{{ cliente?.direccion }}</p>
      </div>
      <div>
        <p class="uppercase text-xs text-gray-500">Teléfono</p>
        <p class="font-medium text-gray-900">{{ cliente?.telefono }}</p>
      </div>
      <a
        [routerLink]="['/tienda/',indice]"
        class="inline-block bg-guinda hover:bg-guinda-dark text-white font-semibold rounded-lg px-4 py-2.5"
        >Tienda</a
      >
    </div>
  </div>
</main>
