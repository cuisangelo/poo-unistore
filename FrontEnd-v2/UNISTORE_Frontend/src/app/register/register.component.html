<html lang="en">
<head>
  <title>Registro</title>
</head>
<div class="flex flex-row space-x-4 pt-4 pb-4 bg-[#8e2929]">
  <div class="pl-5"><img src="favicon.ico"></div>
  <div class=" basis-1/8"><a href="tienda" class="rounded-full cursor-pointer tracking-wider" ><p class="text-white-400 hover:text-sky-400 text-xl text-center uppercase font-bold text-white">UNI Store</p></a></div>
  <div class=" basis-1/2 grow"><p class="text-center"></p></div>
  <div class=" basis-1/8"><a href="tienda" class="rounded-full cursor-pointer tracking-wider" ><p class="text-white-400 hover:text-sky-400 text-xl text-center uppercase font-bold text-white">Inicio</p></a></div>
  <div class=" basis-1/8"><a href="tienda" class="rounded-full cursor-pointer tracking-wider" ><p class="text-white-400 hover:text-sky-400 text-xl text-center uppercase font-bold text-white">Tienda</p></a></div>
  <div class=" basis-1/8 pr-5"><a href="register" class="rounded-full cursor-pointer tracking-wider" ><p class="text-white-400 hover:text-sky-400 text-xl text-center uppercase font-bold text-white">Perfil</p></a></div>
</div>
<div class=" bg-auto bg-no-repeat ">

        <div class="mx-auto w-1/2">
          <div class="classDiv">
           <form [formGroup]="registerForm" (ngSubmit)="registerByEmail(registerForm.value)">
          <p class="font-semibold">Nombre</p>
          <input type="text" placeholder="Escriba su nombre" class="border border-indigo-500 w-full mb-2" id="nombres" formControlName="nombres"/>
        <div>
        <div class="classDiv">
          <p class="font-semibold">Apellido</p>
          <input type="text" placeholder="Escriba su apellido" class="border border-indigo-500 w-full mb-2" id="apellidos" formControlName="apellidos"/>
        </div>
        </div>
        <div class="grid grid-cols-2">
          <div class="classDiv">
            <p class="font-semibold">Correo</p>
            <input type="email" placeholder="Escriba su correo" class="border border-indigo-500 w-full mb-2" id="correo" formControlName="correo"/>
          </div>
          <div class="classDiv">
            <p class="font-semibold">Contraseña</p>
            <input type="password" placeholder="Escriba su contraseña" class="border border-indigo-500 w-full mb-2" id="contrasena" formControlName="contrasena"/>
          </div>
        </div>
        <div class="classDiv">
          <p class="font-semibold">Direccion</p>
          <input type="text" placeholder="Escriba su direccion" class="border border-indigo-500 w-full mb-2" id="direccion" formControlName="direccion"/>
        </div>
        <div class="classDiv">
          <p class="font-semibold">Telefono</p>
          <input type="text" placeholder="Escriba su telefono" class="border border-indigo-500 w-full mb-2" id="telefono"  formControlName="telefono"/>
        </div>
        <input class=" bg-blue-400 hover:bg-sky-700 text-white w-full rounded-md cursor-pointer tracking-wider" type="submit" value="Log In">
    </form>
    <div *ngIf="errorStatus">
      <p>{{errorMsg}}</p>
    </div>
        <div>
          <button class="bg-blue-400 hover:bg-sky-700 text-white w-full rounded-md cursor-pointer tracking-wider" ><a href="login">¿Ya estas registrado? Logeate</a></button>
        </div>
      </div>

    <div>
      <img class="h-screen" src="assets/imagenes/uni.jpg">
    </div></div>
      </div>
