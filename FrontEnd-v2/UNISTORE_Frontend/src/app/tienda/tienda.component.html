<div class="flex flex-row space-x-4 pt-4 pb-4 bg-[#8e2929]">
  <div class="pl-5"><img src="favicon.ico"></div>
  <div class=" basis-1/8"><a href="tienda" class="rounded-full cursor-pointer tracking-wider" ><p class="text-white-400 hover:text-sky-400 text-xl text-center uppercase font-bold text-white">UNI Store</p></a></div>
  <div class=" basis-1/2 grow"><p class="text-center"></p></div>
  <div class=" basis-1/8"><a href="tienda" class="rounded-full cursor-pointer tracking-wider" ><p class="text-white-400 hover:text-sky-400 text-xl text-center uppercase font-bold text-white">Inicio</p></a></div>
  <div class=" basis-1/8"><a href="tienda" class="rounded-full cursor-pointer tracking-wider" ><p class="text-white-400 hover:text-sky-400 text-xl text-center uppercase font-bold text-white">Tienda</p></a></div>
  <div class=" basis-1/8 pr-5"><a href="register" class="rounded-full cursor-pointer tracking-wider" ><p class="text-white-400 hover:text-sky-400 text-xl text-center uppercase font-bold text-white">Perfil</p></a></div>
</div>


<div>
  <div class="border-2 bg-[url('assets/imagenes/asdf.jpg')] space-y-4">
    <div class="w-fit mx-auto  bg-white">
      <div>
        <img class=" w-full	" src="assets/imagenes/slider1.jpg">
      </div>
      <div class=" items-center border-2 rounded-lg bg-[#ba3d3b] pt-2 pb-2" ><p class="text-center uppercase font-bold text-5xl">Tienda</p></div>
      <div class="  pt-3 grid grid-cols-4 gap-4  ">
        <article *ngFor="let item of lista, let indice=index">
          <div class=" box-border md:box-content border-2 rounded-lg  curso static pt-1 pr-1 pb-1 pl-1">
            <img [src]="item.url_imagen" class="img-responsive rounded-lg pb-2 h-56	">
            <div class="pb-4">
              <div class="text-center border-2 rounded-lg"><a class="text-xl font-semibold ">{{item.nombre}}</a></div>
              <div><a class="text-md pb-4">{{item.descripcion}}</a></div>
            </div>
            <div class="absolute left-16  bottom-24">
              <div class="text-center line-through font-semibold text-2xl antialiased 	">s/ {{item.precio_unitario}}</div>
            </div>
            <div class="absolute right-16 bottom-24">
              <div class="text-center text-2xl antialiased 	 ">s/ {{item.precio_oferta}}</div>
            </div>
            <div class="grid grid-cols-2 gap-1 absolute left-24 bottom-2 ">
              <div class="border-2 rounded-lg bg-[#ba4a3b] hover:bg-[#ba3d3b] " ><a class="btn" ><p class="text-sm text-[#ecdfcf] text-center" [routerLink]="['/detalle/',indice]">Más Detalle</p></a></div>
            </div>
            <div class="content-center text-center bg-[#fe0000] rounded absolute top-1 left-1 flex"><span class="text-white text-sm font-bold">OFERTA</span></div>
          </div>
        </article>
      </div>
    </div>
  </div>
</div>
